<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Dashboard - Task Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d9c58">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #a1c4fd, #c2e9fb);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .main-box {
      background: #fff;
      margin: 40px 0;
      padding: 34px 28px 28px 28px;
      border-radius: 10px;
      box-shadow: 0 0 20px #b0c4de66;
      width: 97vw; max-width: 410px;
      min-height: 400px;
    }
    h2 {
      color: #2d4686;
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 18px;
    }
    #taskForm {
      text-align: center;
      margin-bottom: 15px;
    }
    #taskInput {
      width: 80%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #b0c4de;
      background: #f7fafc;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
    }
    button {
      padding: 10px 16px;
      background-color: #2d9c58;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px #b0c4de33;
      margin-left: 3px;
    }
    button:hover { background-color: #19793b; }
    #taskList {
      list-style: none;
      padding: 0;
    }
    #taskList li {
      display: flex;
      justify-content: space-between;
      background: #f7fafc;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 5px;
      align-items: center;
    }
    #taskList button {
      background: #e57373;
      color: #fff;
      border-radius: 4px;
      border: none;
      font-size: 14px;
      padding: 6px 10px;
      margin-left: 8px;
      transition: background 0.2s;
    }
    #taskList button:hover { background: #b71c1c; }
  </style>
</head>
<body>
  <div class="main-box">
    <h2>Your Tasks</h2>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="New task" required />
      <button type="submit">Add Task</button>
    </form>
    <ul id="taskList"></ul>
  </div>
<script>
const userEmail = localStorage.getItem('userEmail');
if (!userEmail) {
  alert('Not logged in! Returning to login page.');
  window.location.href = 'login.html';
}

// Load tasks on page load
fetchTasks();

async function fetchTasks() {
  const response = await fetch(`/tasks?user_email=${encodeURIComponent(userEmail)}`);
  const tasks = await response.json();
  const ul = document.getElementById('taskList');
  ul.innerHTML = '';
  tasks.forEach(task => {
    const li = document.createElement('li');
    li.textContent = task.description;
    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.onclick = function() { deleteTask(task.id); };
    li.appendChild(delBtn);
    ul.appendChild(li);
  });
}

async function addTask(description) {
  const response = await fetch('/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({description, user_email: userEmail})
  });
  if (response.ok) {
    fetchTasks();
    document.getElementById('taskInput').value = '';
  } else {
    alert('Failed to add task');
  }
}

async function deleteTask(id) {
  const response = await fetch(`/tasks/${id}`, {method: 'DELETE'});
  if (response.ok) fetchTasks();
}

document.getElementById('taskForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const taskInput = document.getElementById('taskInput');
  if (taskInput.value.trim() === '') {
    alert('Task cannot be empty.');
    return;
  }
  addTask(taskInput.value);
});
</script>
</body>
</html>
